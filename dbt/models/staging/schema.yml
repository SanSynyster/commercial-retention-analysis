version: 2

models:
  - name: stg_clean_transactions
    description: Canonical transaction-level analytical source read from the processed parquet generated by the Python pipeline.
    columns:
      - name: invoice_no
        description: Source invoice identifier.
        tests:
          - not_null
      - name: stock_code
        description: Product stock code from the source transaction line.
      - name: quantity
        description: Transaction line quantity.
        tests:
          - not_null
      - name: invoice_date
        description: Transaction timestamp.
        tests:
          - not_null
      - name: unit_price
        description: Unit price in source currency.
        tests:
          - not_null
      - name: customer_id
        description: Identifiable customer key; null for anonymous transactions.
      - name: line_revenue_gross
        description: Quantity multiplied by unit price before analytical exclusions.
      - name: exclusion_reason
        description: Reason the line is excluded from customer-level analytical revenue, or valid_order_line.
        tests:
          - accepted_values:
              arguments:
                values: ['cancelled_invoice', 'negative_quantity', 'non_positive_unit_price', 'missing_customer_id', 'valid_order_line']
      - name: is_valid_order_line
        description: True when the line is positive, non-cancelled, and tied to an identifiable customer.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: analytical_revenue
        description: Revenue included in lifecycle, retention, and CLV analytics.
        tests:
          - not_null
